title: Morning Games
description: A collection of simple 7-minute parent-child movement games for young children. Each game is one continuous activity designed to make it fun to practice attention, balance, coordination, body awareness, impulse control, and calm, deliberate movement.
url: ""
baseurl: "/morning-games"

collections:
  activities:
    output: true
    permalink: /games/:name/

defaults:
  - scope:
      path: ""
      type: activities
    values:
      layout: activity

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - _templates
